name: Bake album cover URLs

# GitHub 서버(네트워크 열림)에서 iTunes 아트워크 URL을 뽑아 js/albumArt.js 로 베이크하고
# 변경이 있으면 자동 커밋한다. → 배포된 사이트는 런타임 API에 의존하지 않고 커버를 로드.
#
# 트리거:
#  - 수동 실행(Actions 탭 → Run workflow)
#  - 데이터/스크립트/이 워크플로가 바뀌어 push 될 때 (albumArt.js 만 바뀌면 재실행 안 됨 → 루프 방지)

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/game-analysis-improvements-7mccdp"
    paths:
      - "js/data.js"
      - "scripts/fetch-art.mjs"
      - "scripts/detect-title.mjs"
      - "scripts/fetch-members.mjs"
      - ".github/workflows/fetch-art.yml"

permissions:
  contents: write

concurrency:
  group: bake-art-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch cover art → js/albumArt.js
        env:
          ITUNES_COUNTRY: us
        run: node scripts/fetch-art.mjs

      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-kor

      - name: Detect album title on cover (OCR) → js/coverMeta.js
        run: node scripts/detect-title.mjs

      - name: Fetch member photos (Wikimedia Commons) → js/memberPhotos.js
        run: node scripts/fetch-members.mjs

      - name: Commit baked files if changed
        run: |
          if [ -n "$(git status --porcelain js/albumArt.js js/coverMeta.js js/memberPhotos.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add js/albumArt.js js/coverMeta.js js/memberPhotos.js
            git commit -m "chore: bake covers + title flags + member photos [skip ci]"
            git push
            echo "✅ baked files updated"
          else
            echo "ℹ️ No changes"
          fi
