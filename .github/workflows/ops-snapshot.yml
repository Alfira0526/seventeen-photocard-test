name: Ops snapshot (telemetry & reports)

# Firebase 텔레메트리/제보를 주간 스냅샷해 docs/ops/ 에 커밋한다.
# (샌드박스는 Firebase 접근이 막혀 있어, 열린 네트워크인 Actions 에서 수집한다.)
# 주간 리뷰 루틴(Claude)이 이 스냅샷을 읽어 5인 페르소나 리뷰를 수행한다.

on:
  workflow_dispatch: {}
  schedule:
    # 매주 월요일 00:17 UTC (KST 09:17) — 리뷰 루틴(02:00 UTC)보다 먼저 돌도록.
    # 3주 연속 스케줄 미발동 관측(2026-07) → cron 값을 변경해 GitHub 스케줄러 재등록을 유도.
    # (:00/:10 정각 회피로 대기열 혼잡도 완화 겸함. 미발동 지속 시 워크플로 파일 재생성 검토.)
    - cron: "17 0 * * 1"

permissions:
  contents: write

concurrency:
  group: ops-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/game-analysis-improvements-7mccdp
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch Firebase stats & reports → docs/ops/
        run: node scripts/ops-snapshot.mjs
      - name: Commit snapshot if changed
        run: |
          if [ -n "$(git status --porcelain docs/ops)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/ops
            git commit -m "chore(ops): weekly telemetry & report snapshot [skip ci]"
            git push
            echo "✅ ops snapshot updated"
          else
            echo "ℹ️ No changes"
          fi
