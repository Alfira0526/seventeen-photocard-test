<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEVENTEEN 앨범 자켓 퀴즈</title>
    <meta
      name="description"
      content="세븐틴 앨범 자켓을 보고 앨범·발매연도·타이틀곡을 맞히는 퀴즈 게임"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="app">
      <!-- 시작 화면 -->
      <section id="screen-start" class="screen active">
        <div class="hero">
          <h1 class="logo">SEVENTEEN<br /><span>ALBUM COVER QUIZ</span></h1>
          <p class="tagline">
            앨범 자켓을 보고 <b>앨범 · 발매연도 · 타이틀곡</b>을 맞혀보세요.
          </p>
          <ul class="rules">
            <li>자켓 1장당 3문제 (앨범 / 연도 / 타이틀곡)</li>
            <li>총 8장, 문제당 10점</li>
            <li>정답률에 따라 캐럿 등급이 매겨집니다</li>
          </ul>
          <button id="btn-start" class="btn primary">게임 시작</button>
        </div>
      </section>

      <!-- 플레이 화면 -->
      <section id="screen-play" class="screen">
        <header class="hud">
          <span class="hud-progress">CARD <b id="progress">1 / 8</b></span>
          <span class="hud-score">SCORE <b id="score">0</b></span>
        </header>

        <div class="play-grid">
          <div class="card-stage">
            <div id="card-art" class="card-art"></div>
          </div>

          <div class="questions">
            <div id="q-album" class="question"></div>
            <div id="q-year" class="question"></div>
            <div id="q-track" class="question"></div>

            <p id="feedback" class="feedback"></p>
            <button id="btn-next" class="btn primary" disabled>다음 카드 →</button>
          </div>
        </div>
      </section>

      <!-- 결과 화면 -->
      <section id="screen-result" class="screen">
        <div class="result">
          <h2>결과</h2>
          <p id="result-score" class="result-score">0 / 0 점</p>
          <div id="result-detail" class="result-detail"></div>
          <button id="btn-restart" class="btn primary">다시 하기</button>
        </div>
      </section>
    </main>

    <footer class="site-foot">
      <small
        >팬메이드 비영리 데모 · 앨범 자켓 이미지의 저작권은 각 저작권자(플레디스 등)에게
        있으며, 식별 목적으로 Apple Music CDN에서 로드합니다.</small
      >
    </footer>

    <!-- albumArt.js 는 scripts/fetch-art.mjs 로 생성됨(없으면 플레이스홀더로 동작) -->
    <script src="js/albumArt.js"></script>
    <script src="js/logic.js"></script>
    <script src="js/data.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
